name: Deploy to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable automatic deployment."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cf.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.cf.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.cf.outputs.ready == 'true'
        run: npm ci

      - name: Remove cron triggers for current Cloudflare account limit
        if: steps.cf.outputs.ready == 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('wrangler.toml')
          lines = p.read_text(encoding='utf-8').splitlines()
          out = []
          i = 0
          while i < len(lines):
              if lines[i].strip() == '[triggers]':
                  i += 1
                  while i < len(lines) and lines[i].strip() and not lines[i].lstrip().startswith('['):
                      i += 1
                  continue
              out.append(lines[i])
              i += 1
          p.write_text(chr(10).join(out) + chr(10), encoding='utf-8')
          PY

      - name: Deploy Worker
        if: steps.cf.outputs.ready == 'true'
        run: npx wrangler deploy
